# Pings the Render free-tier service every 5 minutes so it doesn't spin down
# (Render sleeps free services after ~15 minutes without traffic).
#
# Setup (GitHub repo → Settings → Secrets and variables → Actions → Variables):
#   RENDER_URL        required, e.g. https://anthropic-token-counter.onrender.com
#   KEEPALIVE_UNTIL   optional end date (YYYY-MM-DD, UTC); defaults to the date below
#
# After the end date the job exits immediately, so no pings are sent. To stop sooner,
# disable this workflow in the Actions tab or delete the file.
name: Keep Render awake

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub may delay runs slightly under load)
  workflow_dispatch: # allows a manual test run from the Actions tab

permissions: {} # needs no repository access

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the app
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
          KEEPALIVE_UNTIL: ${{ vars.KEEPALIVE_UNTIL || '2026-11-27' }}
        run: |
          if [[ -z "$RENDER_URL" ]]; then
            echo "::error::Set the repository variable RENDER_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          today="$(date -u +%F)"
          if [[ "$today" > "$KEEPALIVE_UNTIL" ]]; then
            echo "Past end date ($KEEPALIVE_UNTIL); nothing to do."
            exit 0
          fi
          # /healthz is a tiny endpoint served by the app's own server.
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 15 --max-time 60 \
               "${RENDER_URL%/}/healthz"
          echo
          echo "OK: pinged at $(date -u +%FT%TZ) (keep-alive until $KEEPALIVE_UNTIL)"
